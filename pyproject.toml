[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "odil-wave"
version = "0.1.0"
description = "A package for solving the wave equation using the ODIL framework."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Luke Dinsdale", email = "ld2022@ic.ac.uk" },
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "mpltools",
    "pytest",
    "jax",
    "torch",
    "scikit-image",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    # pinned to the .pre-commit-config.yaml revs so local runs match CI
    "ruff==0.17.2",
    "pre-commit>=3.0",
    "ipykernel",
    "nbconvert",
    "torchinfo",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["odil_wave*"]


[project.scripts]
#odil-wave = "odil_wave.cli:main"

[tool.ruff]
line-length = 88
# match pre-commit's ruff hooks, which only see Python files
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "SLF001"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# tests may inspect internals
"tests/*" = ["SLF001"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.pytest.ini_options]
# worktree-local, so concurrent sessions in other worktrees don't prune each
# other's temp dirs (the default /tmp/pytest-of-<user> is shared)
addopts = "--basetemp=.pytest_tmp"
markers = [
    "mps: runs the optimiser on an Apple MPS device (skipped when unavailable)",
]
filterwarnings = [
    "ignore:FigureCanvasAgg is non-interactive, and thus cannot be shown:UserWarning"
]