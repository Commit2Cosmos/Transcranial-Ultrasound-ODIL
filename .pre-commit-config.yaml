repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8

# this defines pre-commit hooks to be run locally before each commit
# it includes black for code formatting and flake8 for linting
