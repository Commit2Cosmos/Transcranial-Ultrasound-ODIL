repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: private-names
        name: no cross-module private imports
        # Plain python, not pytest: tests/conftest.py imports torch, and the CI
        # lint job installs only pre-commit.
        entry: python -c "import sys; sys.path.insert(0, 'tests'); import test_private_names as t; t.test_no_module_imports_a_private_name()"
        language: python
        types: [python]
        pass_filenames: false
      - id: exact-equality
        name: no bare exact-equality asserts in tests
        # See "Comparing arrays in tests" in CODING_STANDARDS.md.
        entry: '\.equal\(|(?<!assert_)array_equal\(|(torch|np)\.all\([^)]*=='
        language: pygrep
        files: ^tests/
        types: [python]

# this defines pre-commit hooks to be run locally before each commit
# ruff lints (ruff-check) and formats (ruff-format); private-names runs the
# AST check of tests/test_private_names.py (ruff's PLC2701 exempts same-package imports);
# exact-equality bans bare torch.equal / np.array_equal / torch.all(a == b) in tests
