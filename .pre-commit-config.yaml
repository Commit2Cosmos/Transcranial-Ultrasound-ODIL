repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

# this defines pre-commit hooks to be run locally before each commit
# ruff lints (ruff-check) and formats (ruff-format)
