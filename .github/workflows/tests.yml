name: tests

on:
  push:
  pull_request:

# Read-only token: authorization markers are trusted only from
# github-actions[bot] in workflows that explicitly request write access.
permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test workflow controller
        run: node --test .github/scripts/


  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: |
          python -m pytest tests/ -q